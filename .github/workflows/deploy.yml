name: Deploy to Linux Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Copy Build Files
        run: |
          rm -rf /var/www/type-exp/*
          cp -r dist/* /var/www/type-exp/

      - name: Restart App
        run: |
          pm2 reload type-exp || pm2 start /var/www/type-exp/server.js --name type-exp
          pm2 save


