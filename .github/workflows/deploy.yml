name: Deploy to Linux Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Copy Build Files
        run: |
          rm -rf /var/www/myapp/*
          cp -r dist/* /var/www/myapp/

      - name: Restart App with PM2
        run: |
          pm2 delete myapp || true
          pm2 start /var/www/myapp/index.js --name myapp
          pm2 save
